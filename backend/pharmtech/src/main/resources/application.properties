spring.application.name=pharmtech

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/medical_billing?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:KOUSHIK@bittu2003}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret
jwt.secret=${JWT_SECRET:pharmtech-jwt-secret-key-for-signing}
jwt.expiration=86400000

# File Upload Max Size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Gemini Vision AI (Free Tier Recognition)
gemini.api.key=${GEMINI_API_KEY:use_your_gemini_key}
